<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2f7f96" />
  <title>Reefy — My Ocean World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>" />
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="ui"></div>

  <div id="menu">
    <div class="menu-fish">
      <span>🐠</span><span>🐟</span><span>🐡</span>
    </div>
    <div class="menu-bubbles">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="menu-card">
      <div class="logo-wrap"><div class="logo">🐠</div></div>
      <h1>Reefy</h1>
      <p class="tagline">Kendi resifini kur, balıklarını büyüt,<br/>koleksiyonunu tamamla</p>
      <button id="play-btn">▶&nbsp; Oyna</button>
      <p class="menu-foot">v0.1.0 &nbsp;•&nbsp; reefy.games</p>
    </div>
  </div>

  <script>
    // main.ts (type=module) çalışana kadar çekilen ilk boyama İngilizce kullanıcılarda
    // bir an Türkçe metin göstermesin diye (FOUC), dil senkron olarak burada çözülüyor.
    (function () {
      try {
        var stored = localStorage.getItem('reefy-lang');
        var lang = stored === 'tr' || stored === 'en'
          ? stored
          : (((navigator.language || '').toLowerCase().indexOf('tr') === 0) ? 'tr' : 'en');
        document.documentElement.lang = lang;
        if (lang === 'en') {
          var tagline = document.querySelector('.tagline');
          if (tagline) tagline.innerHTML = 'Build your own reef, grow your fish,<br/>complete your collection';
          var playBtn = document.getElementById('play-btn');
          if (playBtn) playBtn.innerHTML = '▶&nbsp; Play';
        }
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
