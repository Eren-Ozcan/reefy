// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.3.15'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Bazı eklentiler (örn. revenuecat-purchases-capacitor) kendi build.gradle'ında eski bir
// Kotlin Gradle Plugin sürümü sabitliyor; bu sürüm JDK 21 altında çalışırken Kotlin
// derleyicisinin jvmTarget'ı otomatik "21" olarak algılamasını tanımıyor ve
// "Unknown Kotlin JVM target: 21" hatasıyla derleme başarısız oluyor. Tüm alt projelerin
// Kotlin çıktısını projenin geri kalanıyla tutarlı şekilde 17'ye sabitleyerek bunu önlüyoruz.
subprojects {
    afterEvaluate { proj ->
        if (proj.hasProperty('android') && proj.android.hasProperty('kotlinOptions')) {
            proj.android.kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
